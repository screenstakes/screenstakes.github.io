<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#142F63">

<meta name="description" content="Laura Gao's Wharton case in plain steps: the money, the two piles, how WInS connects, our plan, how we win, and who does what.">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --ground:#F5F7FB; --card:#FFFFFF; --ink:#142F63; --ink-2:#4B5872; --ink-3:#5B6780;
  --line:#DDE3EC; --well:#EEF2F8;
  --dep:#2D5DA8; --dep-2:#6F95D2; --grow:#B9CDEB;
  --a:#6F7FA0; --a-soft:#E6EAF2; --paid:#9AA6BD;
  --b:#D98B2B; --b-soft:#FBEEDC;
  --g1:#1E4B95; --g2:#4F7BC4; --g3:#7E9FD6; --s1:#5E6E8F; --s2:#8E9AB3;
  --yes:#1B7549; --yes-soft:#E3F2E9; --no:#A33A2E; --no-soft:#F8E7E4;
  --r1:#BCCBE6; --r2:#A9BDE0; --r3:#7C9CD1; --r4:#4F7BC4; --r5:#1E4B95;
  --av-b:#A8620F; --av-ink:#FFFFFF;
  --tile-stk:#3F6BB5; --btn:#142F63; --btn-ink:#FFFFFF;
  --focus:#2D5DA8;
  --display:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1627; --card:#16213A; --ink:#E8EEF9; --ink-2:#B3BFD6; --ink-3:#8E9BB4;
    --line:#2A3858; --well:#1C2945;
    --dep:#6F95D2; --dep-2:#A8C1E8; --grow:#35507F;
    --a:#8A9ABD; --a-soft:#243252; --paid:#56648A;
    --b:#E9A650; --b-soft:#3A2D1C;
    --g1:#7FA7E8; --g2:#4F7BC4; --g3:#3E64A3; --s1:#C7CEDB; --s2:#8A95AB;
    --yes:#7FD0A0; --yes-soft:#17352A; --no:#F0998D; --no-soft:#3D2226;
    --r1:#3A5585; --r2:#3F5F95; --r3:#5A7DBA; --r4:#7FA0D8; --r5:#A8C1EE;
    --av-b:#E9A650; --av-ink:#0E1627;
    --tile-stk:#93B5EC; --btn:#A8C1E8; --btn-ink:#0E1627;
    --focus:#A8C1E8;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1627; --card:#16213A; --ink:#E8EEF9; --ink-2:#B3BFD6; --ink-3:#8E9BB4;
  --line:#2A3858; --well:#1C2945;
  --dep:#6F95D2; --dep-2:#A8C1E8; --grow:#35507F;
  --a:#8A9ABD; --a-soft:#243252; --paid:#56648A;
  --b:#E9A650; --b-soft:#3A2D1C;
  --g1:#7FA7E8; --g2:#4F7BC4; --g3:#3E64A3; --s1:#C7CEDB; --s2:#8A95AB;
  --yes:#7FD0A0; --yes-soft:#17352A; --no:#F0998D; --no-soft:#3D2226;
  --r1:#3A5585; --r2:#3F5F95; --r3:#5A7DBA; --r4:#7FA0D8; --r5:#A8C1EE;
  --av-b:#E9A650; --av-ink:#0E1627;
  --tile-stk:#93B5EC; --btn:#A8C1E8; --btn-ink:#0E1627;
  --focus:#A8C1E8;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--ground);color:var(--ink);font:400 16px/1.6 var(--body);padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* chapters */
.chapters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chapters::-webkit-scrollbar{display:none}
.chapters button{flex:none;font:700 13px/1 var(--display);color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.chapters button[aria-current="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--b);width:0;transition:width .35s ease}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:grid;gap:22px}
@media (max-width:460px){.card{padding:22px 18px}}
.step-n{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h1{font:800 clamp(24px,6vw,32px)/1.15 var(--display);letter-spacing:-.015em;margin:8px 0 0;text-wrap:balance}
.say{font-size:17px;line-height:1.6;color:var(--ink-2);margin:10px 0 0;max-width:58ch;text-wrap:pretty}
.say b{color:var(--ink);font-weight:600}
.body{display:grid;gap:14px}

/* ---- the pot (money story only) ---- */
.pot{display:grid;gap:12px}
.pot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pot-head .when{font:700 14px/1.3 var(--display);color:var(--ink-3)}
.pot-head .total{font:800 28px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{position:relative;height:60px;border-radius:10px;background:var(--well);overflow:hidden;display:flex;gap:3px}
.seg{height:100%;flex:none;width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.seg.first{border-radius:10px 0 0 10px}.seg.last{border-radius:0 10px 10px 0}.seg.only{border-radius:10px}
.seg.dep{background:var(--dep)}.seg.dep2{background:var(--dep-2)}
.seg.grow{background:repeating-linear-gradient(135deg,var(--grow) 0 7px,var(--dep-2) 7px 14px)}
.seg.a{background:var(--a)}.seg.b{background:var(--b)}
.empty{position:absolute;inset:0;display:grid;place-items:center;font:600 15px/1 var(--display);color:var(--ink-3)}
.legend{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;font-size:15px;color:var(--ink-2)}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}
.legend .amt{font:700 17px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- shared controls ---- */
.panel{background:var(--well);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:8px}.row .play{justify-self:start}}
.play{font:700 14px/1 var(--display);color:var(--btn-ink);background:var(--btn);border:0;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.play svg{width:12px;height:12px;fill:currentColor}
input[type=range]{width:100%;accent-color:var(--ink);height:40px;margin:0;cursor:pointer}
.ticks{display:flex;justify-content:space-between;font:600 12px/1 var(--display);color:var(--ink-3);margin-top:-2px;font-variant-numeric:tabular-nums}
.cap{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0;min-height:3em}
.cap b{color:var(--ink)}
.seg-btns{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.seg-btns button{font:600 15px/1.25 var(--body);color:var(--ink);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 8px;min-height:52px;cursor:pointer}
.seg-btns button small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.seg-btns button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.seg-btns button[aria-pressed="true"] small{color:var(--btn-ink);opacity:.85}
.panel .seg-btns button:not([aria-pressed="true"]){background:var(--card)}
@media (max-width:520px){.seg-btns.four{--n:2 !important}.seg-btns button{padding:10px 4px;font-size:14px}}
.note{border-radius:10px;padding:14px 16px;font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0}
.note b{color:var(--ink)}
.note.a{background:var(--a-soft)}.note.b{background:var(--b-soft)}.note.plain{background:var(--well)}
.who{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--display);color:var(--ink);background:var(--b-soft);border-radius:999px;padding:5px 10px 5px 5px;vertical-align:middle}
.who i{width:20px;height:20px;border-radius:50%;background:var(--av-b);color:var(--av-ink);font:800 10px/20px var(--display);text-align:center;font-style:normal}

/* ---- step 5: columns draining ---- */
.cols{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;height:170px;padding-top:6px}
.col{display:grid;grid-template-rows:1fr auto;gap:6px;height:100%;cursor:pointer;background:none;border:0;padding:0}
.col .well{position:relative;background:var(--well);border-radius:6px 6px 3px 3px;overflow:hidden}
.col .fill{position:absolute;left:0;right:0;bottom:0;background:var(--a);border-radius:6px 6px 0 0;transition:height .35s ease,background .2s}
.col.future .fill{background:var(--paid)}
.col.on .fill{background:var(--ink)}
.col span{font:700 11px/1 var(--display);color:var(--ink-3);font-variant-numeric:tabular-nums}
.col.on span{color:var(--ink)}
@media (max-width:420px){.col span{font-size:12px;letter-spacing:-.02em}.cols{gap:3px}}

/* ---- step 7: recipe compare ---- */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cmp{min-width:0}
@media (max-width:360px){.compare{grid-template-columns:minmax(0,1fr)}}
.cmp .big small{display:block;font:600 12px/1.3 var(--display);color:var(--ink-3);margin-top:4px}
.cmp{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.cmp h3{font:800 18px/1.2 var(--display);margin:0}
.cmp .sub{font-size:14px;line-height:1.45;color:var(--ink-3);margin:-4px 0 0}
.cmp .big{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.minibar{height:36px;border-radius:8px;overflow:hidden;display:flex;gap:3px;background:var(--well)}
.minibar div{height:100%;flex:none;transition:width .4s ease}
.cmp .legend li{font-size:14px}.cmp .legend .amt{font-size:15px}
@media (max-width:540px){.cmp{padding:12px}.cmp .sub{display:none}.cmp h3{font-size:16px}.cmp .big{font-size:20px}.cmp .legend li{font-size:13.5px;grid-template-columns:12px 1fr auto;gap:6px}.cmp .legend .amt{font-size:14px}.compare{gap:8px}.cmp .legend .sw{width:12px;height:12px}}
.link{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-radius:10px;padding:14px 16px;background:var(--b-soft);color:var(--ink-2);font-size:15.5px;line-height:1.5}
.link b{color:var(--ink)}.link .eq{width:38px;height:38px;border-radius:50%;background:var(--av-b);color:var(--av-ink);display:grid;place-items:center;font:800 24px/1 var(--display)}

/* ---- step 8: the 16-year ribbon ---- */
.ribbon{position:relative;height:96px;margin-top:4px}
.ribbon .track{position:absolute;left:0;right:0;top:34px;height:28px;background:var(--well);border-radius:8px}
.ribbon .hl{position:absolute;top:34px;height:28px;border-radius:8px;transition:left .4s ease,width .4s ease,background .3s}
.ribbon .yr{position:absolute;top:70px;font:700 12px/1 var(--display);color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.ribbon .yr.l{transform:none}.ribbon .yr.r{transform:translateX(-100%)}
.ribbon .pin{position:absolute;top:0;transform:translateX(-50%);font:700 12px/1.2 var(--display);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;transition:left .4s ease}
.ribbon .pin::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:10px;height:10px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.explain{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;border-radius:12px;padding:14px 16px;background:var(--well)}
.explain .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.explain .ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.explain b{display:block;font:800 16px/1.3 var(--display);color:var(--ink);margin-bottom:2px}
.explain span{display:block;font-size:15px;line-height:1.5;color:var(--ink-2)}
@media (max-width:560px){.explain{min-height:150px;align-content:start}}

/* ---- step 9: counts ---- */
.counts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.counts{grid-template-columns:1fr}}
.counts section{border-radius:12px;padding:14px 16px}
.counts .yes{background:var(--yes-soft)}.counts .no{background:var(--no-soft)}
.counts h3{font:800 16px/1.2 var(--display);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.counts .yes h3{color:var(--yes)}.counts .no h3{color:var(--no)}
.counts h3 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.counts ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:15px;line-height:1.45;color:var(--ink)}
.flow{list-style:none;margin:0;padding:0}
.flow li{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.flow li:first-child{border-top:0;padding-top:0}
.flow time{font:800 14px/1.4 var(--display);color:var(--ink)}
.flow span{font-size:15px;line-height:1.5;color:var(--ink-2)}.flow b{color:var(--ink)}

/* ---- step 10: clues + risk scale ---- */
.clues{display:grid;gap:8px}
.clue{display:grid;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.clue q{font:italic 500 15.5px/1.45 var(--body);color:var(--ink)}
.clue .mean{display:none;font-size:14.5px;line-height:1.5;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.clue .mean b{color:var(--ink)}
.clue .tap{font:700 12px/1 var(--display);color:var(--ink-3);letter-spacing:.04em}
.clue[aria-expanded="true"]{border-color:var(--ink);background:var(--well)}
.clue[aria-expanded="true"] .mean{display:block}
.clue[aria-expanded="true"] .tap{display:none}
.scale{position:relative;height:74px}
.scale .stops{position:absolute;left:0;right:0;top:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale .stops i{height:14px;border-radius:4px}
.scale .stops i:nth-child(1){background:var(--r1)}.scale .stops i:nth-child(2){background:var(--r2)}.scale .stops i:nth-child(3){background:var(--r3)}.scale .stops i:nth-child(4){background:var(--r4)}.scale .stops i:nth-child(5){background:var(--r5)}
.scale .lab{position:absolute;top:48px;left:0;right:0;display:flex;justify-content:space-between;font:700 12px/1 var(--display);color:var(--ink-3)}
.scale .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;gap:0;transition:left .45s cubic-bezier(.2,.7,.2,1)}
.scale .mk span{font:800 12px/1 var(--display);color:var(--card);background:var(--ink);border-radius:6px;padding:4px 7px;white-space:nowrap}
.scale .mk::after{content:"";width:0;height:0;margin-left:calc(var(--ax,50%) - 6px);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink)}

/* ---- step 11: does it fit? ---- */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:540px){.picks{grid-template-columns:1fr}}
.pick{display:grid;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);align-content:start}
.pick b{font:800 15.5px/1.3 var(--display)}
.pick .q{font:700 12px/1 var(--display);color:var(--ink-3);letter-spacing:.04em}
.pick .v{display:none;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.pick .badge{display:none;font:800 12px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:5px 8px;justify-self:start}
.pick[aria-expanded="true"] .v,.pick[aria-expanded="true"] .badge{display:block}
.pick[aria-expanded="true"] .q{display:none}
.pick.good[aria-expanded="true"]{background:var(--yes-soft);border-color:transparent}
.pick.bad[aria-expanded="true"]{background:var(--no-soft);border-color:transparent}
.pick.good .badge{background:var(--yes);color:var(--card)}
.pick.bad .badge{background:var(--no);color:var(--card)}

/* ---- step 12: donut ---- */
.donut-wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:220px;height:220px;max-width:100%}
.donut circle.slice{fill:none;cursor:pointer;transition:stroke-width .2s}
.donut text{fill:var(--ink);font-family:var(--display)}
.donut .ctr1{font-weight:800;font-size:26px}.donut .ctr2{font-weight:600;font-size:12px;fill:var(--ink-3)}
.keys{display:grid;gap:6px;width:100%}
.key{display:grid;grid-template-columns:14px 1fr auto;gap:10px;min-height:44px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.key b{font:800 15px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.key[aria-pressed="true"]{background:var(--well);border-color:var(--line);color:var(--ink)}
.key .grp{grid-column:2 / 4;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:-2px}
@media (max-width:560px){.tnote{min-height:260px;align-content:start}}
.tnote{border:1px solid var(--line);border-left:4px solid var(--b);border-radius:10px;padding:14px 16px;display:grid;gap:6px;background:var(--card)}
.tnote .t{font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tnote p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2);display:grid;grid-template-columns:96px 1fr;gap:10px}
.tnote p b{color:var(--ink)}
@media (max-width:420px){.tnote p{grid-template-columns:1fr;gap:0}}

/* ---- step 13: area chart ---- */
.area svg{display:block;width:100%;height:auto}
.area text{font-family:var(--display);font-size:14px;font-weight:700;fill:var(--ink-3)}
.area text.in{fill:var(--card);font-size:19px;font-weight:800}
.area .mark{stroke:var(--b);stroke-width:5;stroke-linecap:round}
@media (max-width:560px){.area text{font-size:26px}.area text.in{font-size:28px}}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.readout .y{font:800 22px/1 var(--display)}
.readout .m{font:700 15px/1.3 var(--display);color:var(--ink-2)}

/* ---- step 14: most teams vs us ---- */
.vs{display:grid;gap:8px}
.vs-row{display:grid;grid-template-columns:1fr;gap:4px;border-radius:12px;padding:12px 14px;background:var(--well);transition:background .3s}
.vs-row .topic{font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.vs-row .txt{font-size:15.5px;line-height:1.45;color:var(--ink)}
.vs.us .vs-row{background:var(--b-soft)}
.vs-foot{font-size:14px;color:var(--ink-3);margin:0}

<script>
(function () {
  function $(id) { return document.getElementById(id); }

  /* ---------- Chapter 1: the story ---------- */
  S({ ch: "The story", title: "Laura is building an art house.",
    say: "In <b>2033</b> she wants to open a place in <b>Taiwan</b> where artists and writers can live and work for a while. We’re her money team, Wall Street Warriors. Our job: make sure her yearly $50K payments are covered, and work out how much she can put toward the building.",
    pot: function () { return { when: "2026, right now", total: "$0", segs: [], empty: "Nothing invested yet" }; },

    pot: function () { return { when: "2027 and 2028", segs: [{ cls: "dep", v: 300, label: "First deposit, 2027" }, { cls: "dep2", v: 150, label: "Second deposit, 2028" }] }; } });

  S({ ch: "The story", title: "We let it grow.",
    say: "Drag the slider or press Play. Solid blue is what she put in. The stripes are <b>growth</b>, money the investments made on their own. This example assumes about <b>7% a year</b>.",
    pot: function () { var y = ui.grow, t = potAt(y, RATE), p = y >= 2028 ? 450 : 300; return { when: "Start of " + y, segs: [{ cls: "dep", v: p, label: "What she put in" }, { cls: "grow", v: t - p, label: "Growth" }] }; },
    html: '<div class="panel"><div class="row"><button class="play" id="play" type="button">' + playIcon + 'Play</button><div><input type="range" id="grow" min="2027" max="2033" step="1" aria-label="Year"><div class="ticks"><span>2027</span><span>2033</span></div></div></div><p class="cap" id="cap" aria-live="polite"></p></div>' +
      '<p class="note plain"><b>Why six years, not seven?</b> Money that goes in at the start of 2027 and gets counted at the start of 2033 has had six birthdays (2033 minus 2027). The $150K from 2028 gets five.</p>',

    pot: function () { var t = potAt(2033, RATE); return { when: "Start of 2033 (example)", segs: [{ cls: "a", v: RESERVE, label: "Pile A: the bills" }, { cls: "b", v: t - RESERVE, label: "Pile B: the leftover" }] }; },
    html: '<p class="note a"><b>Pile A is the bills.</b> She promised the art house $50K a year for 10 years, 2033 to 2042. This pile has to cover every one with a high degree of certainty. The case calls it the <b>operating reserve</b>. Example numbers: 7% growth a year, bonds paying about 4%.</p>' +
      '<p class="note b"><b>Pile B is the leftover.</b> We recommend how much of it she puts toward the building, and she keeps the rest as a cushion.</p>' });

  S({ ch: "The story", title: "Watch Pile A pay the bills.",
    say: "Each column is one year. Every year $50K goes out, so the pile shrinks. It’s kept in <b>bonds</b> (loans to the government that pay back on a set date). If they pay about 4%, the pile earns a little while it waits. Tap a year or press Play.",
    html: '<div class="cols" id="cols" role="group" aria-label="Pile A left after each yearly payment"></div>' +
      '<div class="panel"><div class="row"><button class="play" id="play" type="button">' + playIcon + 'Play</button><p class="cap" id="cap" aria-live="polite" style="min-height:0"></p></div></div>',
    mount: function (draw) {

    pot: function () {

    },

      [["none", "No growth", "0% a year"], ["slow", "Slow", "5% a year"], ["normal", "Normal", "7% a year"], ["strong", "Strong", "9% a year"]].map(function (s) {

    else if (e.key === "ArrowLeft" && i > 0) { i--; render(true); moved = true; }
    if (moved && inBody) document.querySelector("#text h1").focus({ preventScroll: true });
  });
  /* floating labels are placed in pixels, so re-place them when the screen size changes */
  var rq; window.addEventListener("resize", function () { cancelAnimationFrame(rq); rq = requestAnimationFrame(draw); });
  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } catch (e) {}
  render(false);
  /* labels are measured in pixels; re-place them once the web font has swapped in */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
