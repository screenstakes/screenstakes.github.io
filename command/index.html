<title>J.A.R.V.I.S. — FITZ COMMAND</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#03070d;color:#cdeffa;
       font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif;
       display:grid;place-items:center;padding:24px;overflow:hidden}
  .bg{position:fixed;inset:0;pointer-events:none;opacity:.5;
      background:radial-gradient(circle at 50% 45%,rgba(29,74,92,.28),transparent 62%)}
  .lock{position:relative;width:min(420px,100%);text-align:center}
  .ring{width:132px;height:132px;margin:0 auto 26px;position:relative}
  .ring svg{width:100%;height:100%;display:block}
  .r1{transform-origin:50% 50%;animation:spin 22s linear infinite}
  .r2{transform-origin:50% 50%;animation:spin 14s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.r1,.r2{animation:none}}
  h1{font-size:15px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
     margin:0 0 6px;color:#53c6e0}
  .sub{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
       letter-spacing:.16em;color:#4d7183;text-transform:uppercase;margin:0 0 30px}
  form{display:flex;flex-direction:column;gap:11px}
  input{width:100%;padding:14px 16px;font-size:16px;   /* 16px = iOS will not zoom */
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;
        color:#cdeffa;background:rgba(11,26,38,.62);
        border:1px solid #1d4a5c;border-radius:2px;outline:none;text-align:center}
  input::placeholder{color:#3b5a6b;letter-spacing:.14em}
  input:focus{border-color:#53c6e0;box-shadow:inset 0 0 0 1px rgba(83,198,224,.35)}
  button{padding:14px 16px;font-size:11.5px;font-weight:600;letter-spacing:.24em;
         text-transform:uppercase;color:#03070d;background:#53c6e0;
         border:0;border-radius:2px;cursor:pointer;font-family:inherit}
  button:hover{background:#7fd8ec}
  button:disabled{opacity:.55;cursor:default}
  .msg{min-height:17px;margin-top:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
       font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#4d7183}
  .msg.err{color:#ff5a36}
  .foot{margin-top:34px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        font-size:9.5px;letter-spacing:.11em;color:#2f4957;line-height:1.75}
</style>
</head>

<div class="bg"></div>
<div class="lock">
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="r1">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#1d4a5c" stroke-width="1" stroke-dasharray="2 6"/>
        <circle cx="50" cy="50" r="39" fill="none" stroke="#1d4a5c" stroke-width="3"
                stroke-dasharray="26 14 46 10" opacity=".65"/>
      </g>
      <g class="r2">
        <circle cx="50" cy="50" r="31" fill="none" stroke="#53c6e0" stroke-width="1"
                stroke-dasharray="14 62" opacity=".75"/>
      </g>
      <circle cx="50" cy="50" r="20" fill="none" stroke="#1d4a5c" stroke-width="1"/>
      <circle cx="50" cy="50" r="9" fill="#53c6e0" opacity=".16"/>
      <path d="M44 48v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#53c6e0" stroke-width="1.6"/>
      <rect x="42.5" y="48" width="15" height="11" rx="1.4" fill="none" stroke="#53c6e0" stroke-width="1.6"/>
    </svg>
  </div>
  <h1>Fitz Command</h1>
  <p class="sub">Secure channel — authentication required</p>
  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="PASSPHRASE" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Passphrase">
    <button id="b" type="submit">Authenticate</button>
  </form>
  <div class="msg" id="m" role="status" aria-live="polite">Awaiting credentials, sir.</div>
  <div class="foot">
    AES-256-GCM · PBKDF2 600,000 ROUNDS<br>

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const m = document.getElementById('m'), b = document.getElementById('b'), p = document.getElementById('p');

async function unlock(pass, quiet){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b2a(SALT), iterations:ITER, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(IV)}, key, b2a(DATA));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem('fc.k', pass); } catch(e){}
  document.open(); document.write(html); document.close();
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = p.value.trim();
  if (!pass) return;
  b.disabled = true; m.className = 'msg'; m.textContent = 'Verifying…';
  try {
    await unlock(pass);
  } catch (err) {
    m.className = 'msg err'; m.textContent = 'Access denied.';
    b.disabled = false; p.value = ''; p.focus();
  }
});

/* stay unlocked for the rest of the browser session */
(async () => {
  let k = null; try { k = sessionStorage.getItem('fc.k'); } catch(e){}
  if (k) { try { await unlock(k, true); } catch(e){ try{ sessionStorage.removeItem('fc.k'); }catch(_){} } }
  p.focus();
})();
</script>
